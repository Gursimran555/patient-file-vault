name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Windows and macOS matter here: v1's case-variant overwrite only
    # reproduces on case-insensitive filesystems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v -rs
      - run: python -m vault.attacks
